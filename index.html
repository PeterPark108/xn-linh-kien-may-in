<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>XN Linh Kiện Máy In – Quản lý sản xuất</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">⚙</span><span class="brand-text"><b>XN Linh Kiện</b><small>Máy in · Gia công</small></span></div>
    <nav id="nav"></nav>
    <div class="side-foot"><button class="btn ghost sm" id="btnReset" title="Khôi phục dữ liệu mẫu">↺ <span>Khôi phục dữ liệu mẫu</span></button></div>
  </aside>
  <div class="backdrop" id="backdrop"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="btnMenu" aria-label="Menu">☰</button>
      <div class="search"><input id="gSearch" placeholder="Tìm đơn hàng, khách, lệnh SX, máy, vật tư..." autocomplete="off"><div class="search-res" id="gRes"></div></div>
      <div class="top-actions">
        <button class="icon-btn" id="btnTheme" title="Sáng/Tối">◐</button>
        <div class="notif"><button class="icon-btn" id="btnNotif" title="Thông báo">🔔<span class="dot" id="notifCount"></span></button><div class="dropdown" id="notifList"></div></div>
        <select id="roleSel" title="Vai trò demo (phân quyền mẫu)" class="role-sel"></select><div class="user"><span class="avatar">QĐ</span><span class="uname"><b>Quản đốc (mẫu)</b><small>Ca sáng</small></span></div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="modal" id="modal"><div class="modal-box"><div class="modal-head"><h3 id="mTitle"></h3><button class="icon-btn" data-close>✕</button></div><form id="mForm" novalidate></form></div></div>
<div class="modal" id="cModal"><div class="modal-box" style="width:420px"><div class="modal-head"><h3>Xác nhận</h3></div><div style="padding:18px 16px" id="cMsg"></div><div class="f-act" style="padding:0 16px 16px"><button class="btn ghost" id="cNo">Hủy</button><button class="btn danger" id="cYes">Đồng ý</button></div></div></div>
<div class="toasts" id="toasts"></div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/modules.js"></script>
<script src="js/app.js"></script>
</body>
</html>
